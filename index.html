function badge(s){return `<span class="badge ${['NDR','Action needed','Escalated','Disputed'].includes(s)?'warn':['In transit','Processing','Picked up','Watch'].includes(s)?'blue':''}">${s}</span>`}function table(heads,rows,type){return `<div class="tablewrap"><table class="data"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr data-row="${type}:${i}">${r.map((v,j)=>`<td>${j===0?`<span class="mono">${v}</span>`:j===r.length-1?badge(v):v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function metric(label,value,change,major=false){return `<div class="ribbon-item" data-metric="${label}"><label>${label}</label><strong>${value}</strong><small>${change} this week</small></div>`}
function chart(){return `<div class="plot"><div class="charttip" id="tip"></div><svg viewBox="0 0 700 160" preserveAspectRatio="none" aria-label="Weekly revenue chart"><defs><linearGradient id="wash" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ef5237" stop-opacity=".2"/><stop offset="1" stop-color="#ef5237" stop-opacity="0"/></linearGradient></defs>${[24,58,92,126].map(y=>`<line class="gridline" x1="34" x2="690" y1="${y}" y2="${y}"/>`).join('')}<path class="fillpath" d="M34 126 C68 120 87 101 121 108 S170 82 206 94 S258 62 293 71 S342 46 378 59 S426 39 462 50 S508 26 546 41 S597 19 632 30 S668 18 690 24 V143 H34Z"/><path class="salespath" d="M34 126 C68 120 87 101 121 108 S170 82 206 94 S258 62 293 71 S342 46 378 59 S426 39 462 50 S508 26 546 41 S597 19 632 30 S668 18 690 24"/>${[[34,126],[121,108],[206,94],[293,71],[378,59],[462,50],[546,41],[632,30],[690,24]].map(([x,y],i)=>`<circle class="data-dot" data-i="${i}" cx="${x}" cy="${y}" r="4"/>`).join('')}${['MON','TUE','WED','THU','FRI','SAT','SUN'].map((d,i)=>`<text class="axis" x="${34+i*108}" y="155">${d}</text>`).join('')}</svg></div>`}
function home(){return `<section class="view"><div class="intro"><div><div class="overline">YOUR FRIDAY FIELD NOTES · 01 / THE DAY</div><h1>A good day<br>to <em>keep moving.</em></h1><p>Morning, Kirtios. Here’s your business, <b>with the useful bits up front.</b></p></div><div class="filters"><span style="font:9.85px var(--mono);color:#8b8980">LOOKING AT</span><select id="date" class="select"><option>Last 7 days</option><option>Today</option><option>Yesterday</option><option>Last 30 days</option><option>Custom</option></select><button class="button" id="export">↧ Save a copy</button></div></div><div class="hero-grid"><section class="lead-panel"><div class="lead-copy"><div class="section-index">01 / COMMERCE IN MOTION</div><div class="sales-label">Net sales, all channels</div><div class="sales-total"><sup>₹</sup>48.6L</div><div class="sales-change">↗ 12.8% <span>compared to last week</span></div><div class="sales-foot"><div class="foot-stat"><strong>1,284</strong><small>ORDERS PLACED</small></div><div class="foot-stat"><strong>₹3,785</strong><small>AVERAGE ORDER</small></div><div class="foot-stat"><strong>3.8×</strong><small>MARKETING RETURN</small></div></div></div><div class="orbit"><div class="orbit-core">+12%</div><div class="orbit-tag one" data-metric="Returning customers">RETURNING<b>31%</b></div><div class="orbit-tag two" data-metric="Ad revenue">AD REVENUE<b>₹24.3L</b></div><div class="orbit-tag three" data-metric="Orders today">TODAY<b>186 orders</b></div><div class="orbit-caption">THE ORBIT / WEEKLY MOMENTUM</div></div></section><div class="right-stack"><article class="note-panel lilac" data-insight="0"><div class="note-top"><span>02 / A PATTERN TO NOTICE</span><span>✳</span></div><div class="note-stamp">ECOIQ<br>FIELD NOTE<br>NO. 024</div><h2>Good things happen when you catch a delivery early.</h2><p>8 people in Maharashtra may need a quick nudge. There’s ₹42,800 worth of orders still in reach.</p><div class="note-arrow">↗</div></article><article class="note-panel yellow" data-page="NDR"><div class="note-top"><span>03 / THE NEXT SMALL WIN</span><span>→</span></div><h2>Give 24 parcels a second chance.</h2><p>Customer unavailable is the most common reason today. A reschedule could turn a miss into a happy delivery.</p><div class="note-arrow">↗</div></article></div></div><div class="ribbon">${metric('Delivery success','97.4%','↑ 2.1%')}${metric('NDR rate','12.8%','↑ 1.4 pts')}${metric('COD to collect','₹8.4L','₹1.2L landed')}${metric('Courier spend','₹3.2L','↓ 4.6%')}</div><div class="mid-grid"><section class="ledger"><div class="cardhead"><div><div class="cardtitle">The week, drawn out.</div><div class="cardsub">Net sales each day · current week vs. last</div></div><div class="legend"><span><i></i>THIS WEEK</span><span><i class="old"></i>LAST WEEK</span></div></div>${chart()}</section><section class="dispatch"><div class="cardhead"><div><div class="cardtitle">A few things in motion</div><div class="cardsub">The dispatch desk, right now</div></div><button class="button" data-page="Shipments">All parcels ↗</button></div><div class="dispatch-body"><div class="dispatch-row" data-page="Shipments"><div class="dispatch-icon">↗</div><div><div class="dispatch-name">1,028 parcels on their way</div><div class="dispatch-desc">97.4% expected on time</div></div><div class="dispatch-time">LIVE</div></div><div class="dispatch-row" data-page="NDR"><div class="dispatch-icon" style="background:#f6ddd3;color:var(--red)">!</div><div><div class="dispatch-name">24 need another attempt</div><div class="dispatch-desc">8 have been waiting over 4 hours</div></div><div class="dispatch-time">NOW</div></div><div class="dispatch-row" data-page="Couriers"><div class="dispatch-icon" style="background:#e4e9d7">⌁</div><div><div class="dispatch-name">BlueDart is having a strong day</div><div class="dispatch-desc">98.8% delivery success this week</div></div><div class="dispatch-time">+1.4%</div></div></div></section></div><div class="bottom-grid"><section class="tablecard"><div class="cardhead"><div><div class="cardtitle">Straight from the storefront</div><div class="cardsub">The latest orders, just as they came in</div></div><button class="button" data-page="Orders">All orders ↗</button></div>${table(['ORDER','TIME','CUSTOMER','AMOUNT','PAYMENT','STORE','COURIER','STATUS'],orders,'orders')}</section><section class="pulse-card"><div class="pulse-kicker">A QUESTION FOR YOUR NEXT COFFEE</div><blockquote>What if the next best move is already in your data?</blockquote><div class="pulse-foot"><span>YOUR ECOMIQ COPILOT IS LISTENING</span><button data-page="AI Chat">LET’S ASK ↗</button></div></section></div><div class="footer"><span>ORBIT GOODS / INDIA &nbsp;·&nbsp; DATA SYNCED 2 MIN AGO</span><span>MADE FOR PEOPLE WHO KEEP THINGS MOVING</span></div></section>`}
function listing(p){let o={Orders:{label:'04 / THE ORDER BOOK',title:'The order book.',desc:'Every yes, in one place.',heads:['ORDER','TIME','CUSTOMER','AMOUNT','PAYMENT','STORE','COURIER','STATUS'],rows:orders,type:'orders'},Shipments:{label:'05 / ON THE MOVE',title:'Out in the world.',desc:'Every parcel, every mile.',heads:['AWB','ORDER','COURIER','ROUTE','STATUS','EDD','WEIGHT','COST'],rows:ships,type:'ships'},NDR:{label:'06 / SAVE THE SALE',title:'Try that delivery again.',desc:'A little follow-up can make someone’s day.',heads:['AWB','ORDER','CUSTOMER','COURIER','WHY IT MISSED','TRY','WAITING','STATUS'],rows:ndr,type:'ndr'},Customers:{label:'07 / PEOPLE FIRST',title:'The people behind it.',desc:'A good business remembers who came back.',heads:['CUSTOMER','ORDERS','SPEND','AVERAGE ORDER','DELIVERED','RTO','SEGMENT'],rows:[['Aarav Mehta','12','₹42,890','₹3,574','11','0','VIP'],['Diya Shah','8','₹18,420','₹2,302','7','1','Repeat'],['Kabir Rao','6','₹31,500','₹5,250','6','0','VIP'],['Mira Kapoor','3','₹6,250','₹2,083','2','1','At risk']],type:'people'}}[p];if(!o)return special(p);return `<section class="view"><div class="intro"><div><div class="overline">${o.label}</div><h1>${o.title}</h1><p>${o.desc}</p></div><div class="filters"><button class="button" id="filter">☷ &nbsp; Shape the view</button><button class="button" id="export">↧ Save a copy</button><button class="button red" id="primary">${p==='NDR'?'Start recovery →':p==='Orders'?'Add an order +':'Open an action +'}</button></div></div><div class="ribbon">${metric(p==='NDR'?'Cases to recover':'Today',p==='NDR'?'24':'1,284','↑ 8.2%')}${metric(p==='NDR'?'Recovery so far':'On-time delivery',p==='NDR'?'68.4%':'97.4%','↑ 2.1%')}${metric('Value in motion','₹1.84L','↑ 12.8%')}${metric('Needs a look','8','↓ 4.2%')}</div><section class="tablecard"><div class="cardhead"><div><div class="cardtitle">${p==='NDR'?'A little human help goes a long way.':`All ${p.toLowerCase()}, in one ledger.`}</div><div class="cardsub"><span id="recordCount">${o.rows.length}</span> records · last update moments ago</div></div><select id="status" class="select"><option>All statuses</option><option>In transit</option><option>NDR</option><option>Delivered</option><option>Action needed</option><option>Escalated</option></select></div><div style="padding:11px 13px;border-bottom:1px solid var(--rule)"><input id="searchRows" placeholder="Find a ${p==='Customers'?'person':p==='NDR'?'case':'record'}…" style="border:1px solid var(--rule);background:#fffdf8;padding:9px 10px;font-size:12.31px;width:min(320px,90%);border-radius:3px"></div><div id="tableArea">${table(o.heads,o.rows,o.type)}</div><div class="cardhead" style="border-top:1px solid var(--rule);border-bottom:0"><span class="cardsub">Showing 1–${o.rows.length} of ${p==='Orders'?'1,284':'128'} records</span><div><button class="button" id="prev">←</button> <button class="button" id="next">→</button></div></div></section>${p==='NDR'?`<div class="dispatch" style="margin-top:13px"><div class="cardhead"><div><div class="cardtitle">The recovery playbook</div><div class="cardsub">Call · WhatsApp · reschedule · update address · reattempt · return</div></div><button class="button red" id="playbook">Build a recovery run ↗</button></div></div>`:''}<div class="footer"><span>ORBIT GOODS / INDIA</span><span>GOOD OPERATIONS ARE HUMAN</span></div></section>`}
function special(p){let data={Finance:['08 / THE MONEY TRAIL','Know what landed, what’s owed, and what’s next.',['Wallet','COD due','Shipping','Refunds'],['₹12.8L','₹8.4L','₹3.2L','₹42K']],Marketing:['09 / THE MEGAPHONE','Put a little more behind what’s working.',['Ad spend','Attributed sales','Return','Blended CAC'],['₹6.4L','₹24.3L','3.8×','₹482']],Analytics:['10 / FIND THE THREAD','Ask the numbers a better question.',['Net sales','Orders','Delivery','Return rate'],['₹48.6L','1,284','97.4%','3.2%']],'AI Insights':['11 / FIELD NOTES','Patterns we found, with something useful to try.',['Open notes','Revenue at risk','Next moves','Resolved today'],['3','₹1.84L','8','12']],Settings:['12 / MAKE IT YOURS','Your workspace, your people, your rules.',['Stores','Teammates','Connections','Sync status'],['3','12','8','Good']]}[p]||['13 / ASK A BETTER QUESTION','A clear answer, then a better question.',['Connected sources','Questions today','Saved answers','Copilot'],['8','42','12','Ready']];return `<section class="view"><div class="intro"><div><div class="overline">${data[0]}</div><h1>${p==='AI Chat'?'A question, please.':p==='AI Insights'?'Not just numbers.':'The ${p.toLowerCase()} story.'}</h1><p>${data[1]}</p></div><div class="filters"><button class="button" id="export">↧ Save a copy</button><button class="button red" id="primary">${p==='AI Chat'?'Start a fresh thought →':p==='Settings'?'Save your changes':'Explore the detail →'}</button></div></div><div class="ribbon">${data[2].map((x,i)=>metric(x,data[3][i],i===2?'↑ 2.1%':'↑ 8.2%')).join('')}</div><div class="mid-grid"><section class="ledger"><div class="cardhead"><div><div class="cardtitle">A line through the week</div><div class="cardsub">Seven days of business, with the context attached.</div></div><span class="overline">LIVE VIEW</span></div>${chart()}</section><section class="note-panel lilac" style="min-height:240px" data-insight="0"><div class="note-top"><span>THE THREAD WE FOUND</span><span>✳</span></div><h2>NDR is up 18% in Maharashtra.</h2><p>Tier-2 cities account for 62% of misses. Customer unavailable is the leading reason. Try rescheduling the 8 highest-value orders first.</p><div class="note-arrow">↗</div></section></div>${p==='AI Chat'?`<section class="tablecard"><div class="cardhead"><div><div class="cardtitle">Your EcomIQ field partner</div><div class="cardsub">Ask in plain language. Answers use this sample workspace.</div></div><span class="badge">READY</span></div><div id="chat" style="padding:14px;min-height:125px"><p style="color:#85847c;font-size:12.31px">A few good opening questions:</p>${['Which courier has the highest RTO rate?','Why did delivery slow down?','Show high-value NDR orders.'].map(q=>`<button class="button suggestion" style="margin:0 5px 6px 0">${q}</button>`).join('')}</div><div style="padding:10px;border-top:1px solid var(--rule);display:flex;gap:7px"><input id="chatInput" placeholder="Ask about your business…" style="flex:1;min-width:0;border:1px solid var(--rule);padding:9px;background:white;font-size:12.31px"><button class="button red" id="send">Ask ↗</button></div></section>`:''}<div class="footer"><span>ORBIT GOODS / INDIA</span><span>THE DETAILS MAKE THE DIFFERENCE</span></div></section>`}
function go(p){page=p;history.replaceState({},'',`#${p.toLowerCase().replaceAll(' ','-')}`);$$('.navlink').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#moreMenu').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}function render(){let d=page==='Dashboard'?home():['Orders','Shipments','NDR','Customers'].includes(page)?listing(page):special(page);$('#main').innerHTML=d;wire()}
function metricDetail(name){openDrawer(name,`<p><b>${name}</b> is moving in a good direction this week.</p><div class="detailgrid"><div class="detail"><small>THIS WEEK</small><b>₹48.6L</b></div><div class="detail"><small>LAST WEEK</small><b>₹43.1L</b></div><div class="detail"><small>CHANGE</small><b style="color:#667e42">↗ 12.8%</b></div><div class="detail"><small>UPDATED</small><b>2 min ago</b></div></div><p>Returning customers and Shopify led the change. See the orders behind the number.</p><button class="button red" onclick="window.goPage('Orders')">See the order book ↗</button>`)}function insight(i){let m=[['An NDR bump in Maharashtra','Tier-2 cities account for 62% of misses; customer unavailable is the most common reason.','Reschedule 8 high-value orders first. There is ₹42,800 still in reach.'],['Mumbai pickups are slowing','Delhivery’s afternoon pickup success dipped 6 points this week.','Move the next 30 afternoon parcels to BlueDart and compare tomorrow.'],['The newest ad is working','Meta return is up 0.7× while blended acquisition cost fell ₹64.','Raise its budget 10%, then check the result in 48 hours.']][i]||['A useful signal','Something changed across your commerce data.','Open the affected records to see more.'];openDrawer(m[0],`<div class="overline">WHAT SHIFTED</div><p>${m[1]}</p><div class="overline" style="margin-top:22px">A SMALL NEXT STEP</div><p>${m[2]}</p><div class="actions"><button class="button red" onclick="window.goPage('NDR')">See affected cases ↗</button><button class="button" onclick="window.review()">Mark reviewed</button></div>`)}function rowDetail(raw){let[t,i]=raw.split(':');i=+i;let d=t==='orders'?orders[i]:t==='ndr'?ndr[i]:t==='ships'?ships[i]:null;if(!d){openDrawer(t==='people'?'A customer’s story':t==='courier'?'Courier notes':'Record detail',`<p>A little context from the recent activity.</p><div class="detailgrid"><div class="detail"><small>STATUS</small><b>Active</b></div><div class="detail"><small>UPDATED</small><b>Today</b></div></div><button class="button red" onclick="window.showToast('Related activity opened')">View their activity ↗</button>`);return}let label=t==='orders'?`${d[0]} · ${d[2]}`:t==='ndr'?`${d[0]} · Let’s recover this one`:`${d[0]} · A parcel in motion`;let buttons=t==='ndr'?`<button class="button" onclick="window.doAction('Calling customer')">☎ Call</button><button class="button" onclick="window.doAction('WhatsApp message ready')">◉ WhatsApp</button><button class="button" onclick="window.doAction('Reschedule choices opened')">↻ Reschedule</button><button class="button" onclick="window.doAction('Address update opened')">⌖ Change address</button><button class="button red" onclick="window.doAction('Reattempt scheduled')">Reattempt ↗</button><button class="button" onclick="window.doAction('RTO confirmation opened')">RTO</button>`:`<button class="button" onclick="window.showToast('Tracking link copied')">Copy tracking link</button><button class="button red" onclick="window.showToast('Related records opened')">Related records ↗</button>`;openDrawer(label,`<div class="detailgrid"><div class="detail"><small>${t==='orders'?'ORDER VALUE':'DELIVERY STATUS'}</small><b>${t==='orders'?d[3]:t==='ndr'?d[7]:d[4]}</b></div><div class="detail"><small>COURIER</small><b>${t==='orders'?d[6]:t==='ndr'?d[3]:d[2]}</b></div><div class="detail"><small>CUSTOMER</small><b>${t==='orders'?d[2]:t==='ndr'?d[2]:'Aarav Mehta'}</b></div><div class="detail"><small>DESTINATION</small><b>${t==='ships'?d[3].split(' → ')[1]:'Bengaluru'}</b></div></div><div class="overline">THE PARCEL’S LITTLE TIMELINE</div><div class="timeline"><div><b>Order placed</b><small>Today · 09:12</small></div><div><b>Courier assigned · ${t==='orders'?d[6]:t==='ndr'?d[3]:d[2]}</b><small>Today · 09:28</small></div><div><b>Picked up</b><small>Today · 13:04</small></div><div><b>${t==='ndr'?'Couldn’t deliver · '+d[4]:'Out for delivery'}</b><small>Today · ${t==='ndr'?d[6]+' ago':'17:32'}</small></div></div><div class="actions">${buttons}</div>`)}
function primary(){if(page==='NDR'||page==='Weight')openDrawer(page==='NDR'?'Build a recovery run':'Raise a weight dispute',`<p>${page==='NDR'?'Give these orders another chance to make it home.':'Add courier evidence for a package weight mismatch.'}</p><div class="detailgrid"><div class="detail"><small>${page==='NDR'?'CASES READY':'OPEN REVIEWS'}</small><b>${page==='NDR'?'24':'18'}</b></div><div class="detail"><small>VALUE IN PLAY</small><b>₹1.84L</b></div></div>${page==='Weight'?'<input class="button" placeholder="Enter AWB number" style="width:100%;margin-bottom:10px">':''}<button class="button red" onclick="window.showToast('${page==='NDR'?'Recovery run started · 8 customers queued':'Dispute submitted for review'}')">${page==='NDR'?'Start the recovery run':'Submit dispute'} ↗</button>`);else toast(page==='AI Chat'?'A fresh conversation is ready':page==='Settings'?'Your changes are saved':`${page} action opened`)}function exportData(){let csv='Order,Time,Customer,Amount,Payment,Store,Courier,Status\n'+orders.map(r=>r.join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ecomiq-field-notes.csv';a.click();URL.revokeObjectURL(a.href);toast('Your little CSV is ready')}
function filterRows(q,s){let all=page==='Orders'?orders:page==='NDR'?ndr:page==='Shipments'?ships:[];let match=all.filter(r=>r.join(' ').toLowerCase().includes(q.toLowerCase())&&(s==='All statuses'||r.some(v=>v.toLowerCase()===s.toLowerCase())));let cfg=page==='Orders'?[['ORDER','TIME','CUSTOMER','AMOUNT','PAYMENT','STORE','COURIER','STATUS'],'orders']:page==='NDR'?[['AWB','ORDER','CUSTOMER','COURIER','WHY IT MISSED','TRY','WAITING','STATUS'],'ndr']:[['AWB','ORDER','COURIER','ROUTE','STATUS','EDD','WEIGHT','COST'],'ships'];$('#tableArea').innerHTML=table(cfg[0],match,cfg[1]);$('#recordCount').textContent=match.length;wireRows()}
function wireRows(){$$('[data-row]').forEach(r=>r.onclick=()=>rowDetail(r.dataset.row))}function wire(){ $$('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$$('[data-metric]').forEach(b=>b.onclick=()=>metricDetail(b.dataset.metric));$$('[data-insight]').forEach(b=>b.onclick=()=>insight(+b.dataset.insight));wireRows();let ex=$('#export');if(ex)ex.onclick=exportData;let pri=$('#primary');if(pri)pri.onclick=primary;let q=$('#searchRows');if(q)q.oninput=()=>filterRows(q.value,$('#status')?.value||'All statuses');let st=$('#status');if(st)st.onchange=()=>filterRows($('#searchRows').value,st.value);let f=$('#filter');if(f)f.onclick=()=>openDrawer('Shape the view',`<p>Bring the records you need to the top.</p><label>Courier<select class="select" style="display:block;width:100%;margin:6px 0 13px"><option>All partners</option><option>Delhivery</option><option>BlueDart</option><option>DTDC</option></select></label><label>Payment<select class="select" style="display:block;width:100%;margin:6px 0 13px"><option>Any payment</option><option>COD</option><option>Prepaid</option></select></label><label>Time<select class="select" style="display:block;width:100%;margin:6px 0 13px"><option>Last 7 days</option><option>Today</option><option>Last 30 days</option></select></label><button class="button red" onclick="window.showToast('Your view has been filtered')">Apply this view</button>`);['next','prev'].forEach(id=>{let el=$('#'+id);if(el)el.onclick=()=>toast(id==='next'?'Next set of records opened':'You’re on the first page')});$$('.data-dot').forEach(p=>p.onmousemove=e=>{let t=$('#tip');if(t){t.style.display='block';t.style.left=(e.offsetX+8)+'px';t.style.top=(e.offsetY-16)+'px';t.textContent=`${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][+p.dataset.i%7]} · ₹${(4.1+ +p.dataset.i*1.3).toFixed(1)}L`}});$$('.data-dot').forEach(p=>p.onmouseleave=()=>{if($('#tip'))$('#tip').style.display='none'});$$('.suggestion').forEach(b=>b.onclick=()=>ask(b.textContent));let send=$('#send');if(send)send.onclick=()=>ask($('#chatInput').value);let ci=$('#chatInput');if(ci)ci.onkeydown=e=>{if(e.key==='Enter')ask(ci.value)}}
function ask(q){if(!q?.trim())return;let box=$('#chat');box.innerHTML+=`<div style="text-align:right;margin:8px"><span style="background:var(--blue);color:white;padding:8px 10px;font-size:11.08px">${q.replaceAll('<','&lt;')}</span></div><div class="chatanswer" style="padding:10px;background:#e5e1ef;margin:8px 30px 8px 0;font-size:12.31px">✳ &nbsp;Let me put the pieces together…</div>`;$('#chatInput').value='';setTimeout(()=>{let ans=/courier|rto/i.test(q)?'DTDC has the highest RTO rate at 4.6%, above the 3.2% network average. It clusters in tier-2 Maharashtra. BlueDart is the best alternative for the next 30 COD orders.':/delivery|slow|dip/i.test(q)?'Delivery success is 97.4%, up 2.1 points. The remaining misses cluster around Delhivery afternoon pickups from Mumbai. Moving 30 parcels to BlueDart could improve that lane.':/ndr|high-value/i.test(q)?'Eight high-value orders are in NDR, representing ₹68,400. Five are customer-unavailable cases. Reschedule those today to give them the best chance.':'Net sales are ₹48.6L this week, up 12.8%. Shopify contributed 46%, and the new Meta creative lifted marketing return to 3.8×.';box.querySelectorAll('.chatanswer').at(-1).innerHTML='✳ &nbsp;'+ans+'<br><br><button class="button" onclick="window.goPage(\'NDR\')">See related cases ↗</button>';box.scrollTop=box.scrollHeight},650)}
function cmdOpen(){let c=$('#command');c.classList.add('open');$('#commandScrim').classList.add('open');$('#commandInput').value='';fill('');$('#commandInput').focus()}function cmdClose(){$('#command').classList.remove('open');$('#commandScrim').classList.remove('open')}function fill(q){let records=[...pages.map(p=>({a:p,b:'Open section',f:()=>go(p)})),...orders.map((o,i)=>({a:o[0]+' · '+o[2],b:'Order · '+o[3],f:()=>rowDetail('orders:'+i)})),...ndr.map((r,i)=>({a:r[0]+' · '+r[2],b:'NDR · '+r[4],f:()=>rowDetail('ndr:'+i)}))].filter(r=>(r.a+r.b).toLowerCase().includes(q.toLowerCase())).slice(0,10);$('#cmdresults').innerHTML=records.map((r,i)=>`<div class="cmdrow" data-cmd="${i}"><span>${r.a}</span><span style="color:#999">${r.b}</span></div>`).join('')||'<div style="padding:12px;color:#888">No matches found.</div>';$$('[data-cmd]').forEach((e,i)=>e.onclick=()=>{cmdClose();records[i].f()})}
window.goPage=go;window.showToast=toast;window.review=()=>{closeDrawer();toast('Field note marked as read')};window.doAction=s=>{closeDrawer();toast(s+' · case updated')};$$('.navlink').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#moreButton').onclick=()=>$('#moreMenu').classList.toggle('open');$('#searchButton').onclick=cmdOpen;$('#commandScrim').onclick=cmdClose;$('#commandInput').oninput=e=>fill(e.target.value);$('#assistant').onclick=()=>go('AI Chat');$('#inbox').onclick=()=>openDrawer('The latest notes',`<div class="dispatch-row"><div class="dispatch-icon">!</div><div><div class="dispatch-name">8 NDR cases need a reply</div><div class="dispatch-desc">₹42,800 could still be recovered.</div></div><small>4m</small></div><div class="dispatch-row"><div class="dispatch-icon">₹</div><div><div class="dispatch-name">COD settlement landed</div><div class="dispatch-desc">₹2.4L arrived this morning.</div></div><small>1h</small></div>`);$('#profile').onclick=()=>openDrawer('Kirtioswal Shah',`<p>Workspace owner · Orbit Goods India</p><div class="actions"><button class="button" onclick="window.showToast('Profile settings opened')">Profile settings</button><button class="button" onclick="window.showToast('Workspace switcher opened')">Switch workspace</button></div>`);$('#help').onclick=()=>openDrawer('A hand when you need one',`<p>Quick guides and friendly support for your EcomIQ workspace.</p><div class="actions"><button class="button" onclick="window.showToast('Quick start guide opened')">Quick start</button><button class="button" onclick="window.showToast('Support request created')">Contact support</button></div>`);$('#close').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;$('#date').onchange=e=>toast('Showing '+e.target.value);document.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cmdOpen()}if(e.key==='Escape'){closeDrawer();cmdClose();$('#moreMenu').classList.remove('open')}};window.addEventListener('hashchange',()=>{let p=pages.find(x=>x.toLowerCase()===location.hash.slice(1).replaceAll('-',' '));if(p)go(p)});if(location.hash){let p=pages.find(x=>x.toLowerCase()===location.hash.slice(1).replaceAll('-',' '));if(p)page=p}render();
</script></body></html>
